<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-label="Conceptual data architecture: sources flow through engineering and trust layers into decisions">
  <defs>
    <pattern id="za-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#08131f" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <linearGradient id="za-flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f5ed8" stop-opacity=".22"/>
      <stop offset=".55" stop-color="#11c4c2" stop-opacity=".85"/>
      <stop offset="1" stop-color="#11c4c2" stop-opacity=".25"/>
    </linearGradient>
  </defs>

  <rect width="720" height="360" fill="#ffffff"/>
  <rect width="720" height="360" fill="url(#za-grid)"/>

  <!-- column rails -->
  <g stroke="#08131f" stroke-opacity=".08" stroke-width="1">
    <path d="M96 34V250"/><path d="M272 34V250"/><path d="M448 34V250"/><path d="M624 34V250"/>
  </g>

  <!-- flow lines: sources -> build -> trust -> decide -->
  <g fill="none" stroke="url(#za-flow)" stroke-width="1.4">
    <path d="M144 66C184 66 184 89 224 89"/>
    <path d="M144 112C184 112 184 89 224 89"/>
    <path d="M144 112C184 112 184 135 224 135"/>
    <path d="M144 158C184 158 184 135 224 135"/>
    <path d="M144 158C184 158 184 181 224 181"/>
    <path d="M144 204C184 204 184 181 224 181"/>
    <path d="M320 89H400"/>
    <path d="M320 135H400"/>
    <path d="M320 181H400"/>
    <path d="M320 89C360 89 360 135 400 135"/>
    <path d="M320 181C360 181 360 135 400 135"/>
    <path d="M496 89C536 89 536 112 576 112"/>
    <path d="M496 135C536 135 536 112 576 112"/>
    <path d="M496 135C536 135 536 158 576 158"/>
    <path d="M496 181C536 181 536 158 576 158"/>
  </g>

  <!-- 01 sources -->
  <g>
    <rect x="48" y="51" width="96" height="30" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="48" y="97" width="96" height="30" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="48" y="143" width="96" height="30" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="48" y="189" width="96" height="30" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <g fill="#94a3b8">
      <rect x="58" y="62" width="8" height="8"/><rect x="58" y="108" width="8" height="8"/>
      <rect x="58" y="154" width="8" height="8"/><rect x="58" y="200" width="8" height="8"/>
    </g>
    <g fill="#cbd5e1">
      <rect x="74" y="64" width="56" height="4"/><rect x="74" y="110" width="44" height="4"/>
      <rect x="74" y="156" width="52" height="4"/><rect x="74" y="202" width="38" height="4"/>
    </g>
  </g>

  <!-- 02 build -->
  <g>
    <rect x="224" y="74" width="96" height="30" fill="#ffffff" stroke="#1f5ed8" stroke-width="1.3"/>
    <rect x="224" y="120" width="96" height="30" fill="#ffffff" stroke="#1f5ed8" stroke-width="1.3"/>
    <rect x="224" y="166" width="96" height="30" fill="#ffffff" stroke="#1f5ed8" stroke-width="1.3"/>
    <g fill="#1f5ed8">
      <rect x="234" y="85" width="8" height="8"/><rect x="234" y="131" width="8" height="8"/><rect x="234" y="177" width="8" height="8"/>
    </g>
    <g fill="#1f5ed8" fill-opacity=".28">
      <rect x="250" y="87" width="58" height="4"/><rect x="250" y="133" width="46" height="4"/><rect x="250" y="179" width="54" height="4"/>
    </g>
  </g>

  <!-- 03 trust -->
  <g>
    <rect x="400" y="74" width="96" height="30" fill="#ffffff" stroke="#11c4c2" stroke-width="1.3"/>
    <rect x="400" y="120" width="96" height="30" fill="#ffffff" stroke="#11c4c2" stroke-width="1.3"/>
    <rect x="400" y="166" width="96" height="30" fill="#ffffff" stroke="#11c4c2" stroke-width="1.3"/>
    <g fill="#11c4c2">
      <rect x="410" y="85" width="8" height="8"/><rect x="410" y="131" width="8" height="8"/><rect x="410" y="177" width="8" height="8"/>
    </g>
    <g fill="#11c4c2" fill-opacity=".3">
      <rect x="426" y="87" width="50" height="4"/><rect x="426" y="133" width="58" height="4"/><rect x="426" y="179" width="42" height="4"/>
    </g>
    <g fill="none" stroke="#11c4c2" stroke-width="1.2" stroke-opacity=".55">
      <path d="M478 82l4 4 7-8"/><path d="M478 128l4 4 7-8"/><path d="M478 174l4 4 7-8"/>
    </g>
  </g>

  <!-- 04 decide -->
  <g>
    <rect x="576" y="97" width="96" height="30" fill="#08131f"/>
    <rect x="576" y="143" width="96" height="30" fill="#08131f"/>
    <g fill="#11c4c2">
      <rect x="586" y="108" width="8" height="8"/><rect x="586" y="154" width="8" height="8"/>
    </g>
    <g fill="#ffffff" fill-opacity=".38">
      <rect x="602" y="110" width="52" height="4"/><rect x="602" y="156" width="44" height="4"/>
    </g>
  </g>

  <!-- node markers on rails -->
  <g fill="#11c4c2">
    <rect x="93" y="243" width="6" height="6"/><rect x="269" y="243" width="6" height="6"/>
    <rect x="445" y="243" width="6" height="6"/><rect x="621" y="243" width="6" height="6"/>
  </g>
  <path d="M96 246H624" stroke="#11c4c2" stroke-opacity=".25" stroke-width="1"/>
</svg>
